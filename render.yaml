   services:
     - type: web
       name: inventory-billing-api
       runtime: node
       plan: free
       region: singapore
       rootDir: server
       buildCommand: npm ci --omit=dev
       startCommand: npm start
       healthCheckPath: /api/v1/health
       autoDeploy: true
       envVars:
         - key: NODE_VERSION
           value: "22"
         - key: NODE_ENV
           value: production
         - key: TRUST_PROXY
           value: "2"
         - key: ENABLE_CRON
           value: "false"
         - key: MONGODB_URI
           sync: false
         - key: JWT_ACCESS_SECRET
           generateValue: true
         - key: JWT_REFRESH_SECRET
           generateValue: true
         - key: CRON_SECRET
           generateValue: true