name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # The API tests start an in-memory MongoDB replica set (the first run downloads the binary).
      - run: npm test
        env:
          MONGODB_URI: mongodb://unused/inventory_ci
          JWT_ACCESS_SECRET: ci-access-secret-0123456789
          JWT_REFRESH_SECRET: ci-refresh-secret-0123456789

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build